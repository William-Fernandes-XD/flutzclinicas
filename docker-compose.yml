services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-flutz}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ALTERAR_AQUI}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - flutz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-flutz}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - flutz_media:/app/uploads
      - ./backend/secrets/google-drive-service-account.json:/app/secrets/google-drive-service-account.json:ro
    environment:
      APP_NAME: ${APP_NAME:-Flutz}
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SERVER_PORT: 8080
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-flutz}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-ALTERAR_AQUI}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Flutz}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:-30}
      LOGIN_LOCK_INCREMENT_SECONDS: ${LOGIN_LOCK_INCREMENT_SECONDS:-5}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-0}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      FLUTZ_MEDIA_DIR: /app/uploads
      GOOGLE_DRIVE_ENABLED: ${GOOGLE_DRIVE_ENABLED:-false}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/google-drive-service-account.json
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_CLIENT_ID: ${MERCADOPAGO_CLIENT_ID:-}
      MERCADOPAGO_CLIENT_SECRET: ${MERCADOPAGO_CLIENT_SECRET:-}
      MERCADOPAGO_REDIRECT_URI: ${MERCADOPAGO_REDIRECT_URI:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL relativa: o nginx do frontend faz proxy de /api → backend.
        # Domínio fixo: o .env local tem localhost e a imagem saía com a versão de desenvolvimento.
        VITE_API_URL: ""
        VITE_SITE_URL: https://flutzclinicas.com.br
        VITE_APP_NAME: ${VITE_APP_NAME:-Flutz}
        VITE_COMPANY_NAME: ${VITE_COMPANY_NAME:-UpVibe}
        VITE_COMPANY_URL: ${VITE_COMPANY_URL:-https://www.upvibe.blog.br/}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-contato@flutzclinicas.com.br}
        VITE_CONTACT_WHATSAPP: ${VITE_CONTACT_WHATSAPP:-62981451856}
        VITE_INSTAGRAM_URL: ${VITE_INSTAGRAM_URL:-https://www.instagram.com/flutzclinicas/}
        VITE_DPO_NOME: ${VITE_DPO_NOME:-UpVibe}
        VITE_DPO_EMAIL: ${VITE_DPO_EMAIL:-privacy@flutzclinicas.com.br}
        VITE_PLANO_FLUTZ: ${VITE_PLANO_FLUTZ:-R$ 149,90/mês}
    profiles: ["frontend"]
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  flutz_pgdata:
  flutz_media:
